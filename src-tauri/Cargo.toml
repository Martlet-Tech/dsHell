[package]
name = "dshell"
version = "0.1.5"
edition = "2021"
description = "Minimal desktop container for the DeepSeek Harness Web GUI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: 托盘支持。**不是 tauri 的默认 feature**，不加则 TrayIconBuilder 不存在。
# common-controls-v6: Windows 下让原生对话框支持自定义按钮文字；缺少它时 rfd 退回
#   MessageBoxW，自定义文字被静默丢弃。tauri 的 default 已含它，这里显式写出，
#   防止将来有人关掉 default-features 时静默失效。
tauri = { version = "2", features = ["tray-icon", "common-controls-v6"] }
# 启动页需要把「用户选择」送回 Rust（指定安装位置 / 一键安装 / 取消 / 退出）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 版本台账要做**预发布比较**（0.1.5-rc.1 vs 0.1.5-rc.2 vs 0.1.5），字符串比较会判错方向
# （比如把新版判成旧版，提示用户降级）。semver 1.0.28 本来就是 tauri 的传递依赖、
# 已在 Cargo.lock 里，所以升为直接依赖不新增任何需要下载或编译的包。
semver = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
