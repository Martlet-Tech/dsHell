[package]
name = "dshell"
version = "0.1.0"
edition = "2021"
description = "Minimal desktop container for the DeepSeek Harness Web GUI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 启动页需要把「用户选择」送回 Rust（指定安装位置 / 一键安装 / 取消 / 退出）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
