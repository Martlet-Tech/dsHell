<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DShell</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="stage">
      <div class="glow a"></div>
      <div class="glow b"></div>
      <div class="grid"></div>

      <div class="card">
        <header>
          <div class="mark">
            <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
              <defs>
                <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#7dd3fc" />
                  <stop offset=".5" stop-color="#5b8cff" />
                  <stop offset="1" stop-color="#8b5cf6" />
                </linearGradient>
              </defs>
              <path d="M11 7.5 9 24.5" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round" />
              <path d="M19.5 7.5c4.6 0 7.2 2.4 7.2 6.1 0 3.9-2.9 6.4-7.6 6.4h-3" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div>
            <div class="word">DSHELL</div>
            <div class="sub">DEEPSEEK HARNESS · DESKTOP SHELL</div>
          </div>
        </header>

        <ol id="steps"></ol>

        <section id="install" class="panel" hidden>
          <div class="row">
            <span class="grow" id="inst-title">正在安装</span>
            <span id="inst-pct"></span>
            <span id="inst-elapsed"></span>
            <button id="inst-cancel" disabled>取消</button>
          </div>
          <div class="bar"><i id="inst-bar"></i></div>
          <pre id="inst-log"></pre>
        </section>

        <div id="fail" class="fail"></div>

        <div id="actions">
          <button id="btn-install" disabled>一键安装</button>
          <button id="btn-quit" class="ghost">退出</button>
        </div>

        <a id="skip" hidden>跳过检查，直接启动</a>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <!--
      模块加载的兜底。

      拆成 module 之后多出一种失败方式：`js/app.js` 没取到（或 MIME 不对被
      浏览器拒绝执行）时，页面上**什么都不显示**。而启动页恰恰是唯一能显示
      失败的地方 —— 用户只会看到一片空白加一句无从下手的"坏了"。

      所以这里留一段内联脚本：它不依赖任何外部文件，只要 HTML 解析出来就能跑。
      两处监听缺一不可：
        * `error` 捕获 module 脚本自身的加载失败；
        * `unhandledrejection` / 全局 `error` 捕获模块内部早期抛错。
      加载成功时 `__dshellBooted` 会被 app.js 置真，这里就什么都不做。
    -->
    <script>
      (function () {
        var shown = false;
        function report(what, detail) {
          if (shown || window.__dshellBooted) return;
          shown = true;
          var el = document.getElementById("fail");
          if (el) {
            el.className = "fail show";
            el.textContent =
              "启动页脚本未能加载（" + what + "）。\n\n" +
              (detail ? detail + "\n\n" : "") +
              "这通常是打包不完整或文件损坏。请重新安装 DShell；\n" +
              "完整日志：%USERPROFILE%\\.dshell\\dshell-poc.log";
          }
        }
        window.addEventListener("error", function (e) {
          if (e && e.target && e.target.tagName === "SCRIPT") {
            report("脚本文件没取到", e.target.src || "");
          } else if (e && e.message) {
            report("脚本执行出错", e.message);
          }
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          report("脚本执行出错", e && e.reason ? String(e.reason) : "");
        });
      })();
    </script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
